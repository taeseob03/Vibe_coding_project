[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-character-app"
version = "0.1.0"
description = "Campus character app development scaffold"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "google-genai>=2.34,<3",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
preview = ["google-genai>=2.34,<3", "python-multipart>=0.0.20,<1", "pillow>=11,<13"]

[tool.setuptools]
packages = ["app", "app.accounts", "app.analysis", "app.characters", "app.core", "app.records", "app.integrations", "app.preview", "campus_records_prototype"]

[tool.setuptools.package-dir]
app = "backend/app"
campus_records_prototype = "prototypes/records-analysis/app"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--disable-plugin-autoload"

[tool.ruff]
extend-exclude = ["prototypes"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
