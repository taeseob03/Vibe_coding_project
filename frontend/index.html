<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>캠퍼스 캐릭터 · 개발 환경</title>
  <link rel="stylesheet" href="/shared/styles.css">
</head>
<body>
  <main>
    <h1>캠퍼스 캐릭터</h1>
    <p>팀 개발 환경 확인 화면 · 고정된 임시 분석을 사용합니다.</p>
    <p id="account" role="status">사용자 확인 중…</p>
    <section aria-labelledby="character-heading">
      <h2 id="character-heading">A · 계정과 캐릭터</h2>
      <div id="character"></div>
    </section>
    <section aria-labelledby="record-heading">
      <h2 id="record-heading">B · 기록과 분석</h2>
      <form id="record-form">
        <label for="record-text">오늘의 대학생활</label>
        <textarea id="record-text" required maxlength="10000" rows="4"></textarea>
        <button type="submit">임시 분석으로 저장</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
      <button id="refresh" type="button">목록 새로고침</button>
      <ul id="record-list"></ul>
    </section>
    <p><a href="/docs">API 문서</a></p>
  </main>
  <script type="module" src="/shared/main.js"></script>
</body>
</html>
