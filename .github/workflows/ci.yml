name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Preserve B prototype rules
        working-directory: prototypes/records-analysis
        run: python -m pytest --disable-plugin-autoload -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: B UI and movement tests
        working-directory: prototypes/records-analysis
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Browser game verification
        run: |
          python -m playwright install --with-deps chromium
          python scripts/verify_game.py
      - name: Verify migrations and model consistency
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
